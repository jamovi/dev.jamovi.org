name: Deploy to Cloudflare R2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    if: github.repository == 'jamovi/dev.jamovi.org'
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # served by the cf-jamovi-dev-worker Cloudflare Worker (cf-library-worker)
      - name: Deploy to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't support all of the AWS CLI's default checksums
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: aws s3 sync dist s3://dev-jamovi-org --delete --no-progress
